name: Extension Release
permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  upload-extension:
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Build browser extensions
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run build:firefox
      - name: Package Chromium extension
        shell: bash
        run: |
          VERSION="$(bun -e "const pkg = await import('./extension/package.json'); console.log(pkg.default.version)")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "extension/package.json version $VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          CHROMIUM_ZIP="rvault-extension-${VERSION}.zip"
          (cd extension/build/chrome-mv3-prod && zip -r "../../../${CHROMIUM_ZIP}" .)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CHROMIUM_ZIP=${CHROMIUM_ZIP}" >> "$GITHUB_ENV"
      - name: Sign Firefox extension
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "AMO_JWT_ISSUER and AMO_JWT_SECRET are required to sign the Firefox extension" >&2
            exit 1
          fi
          npx --yes web-ext@10.3.0 sign \
            --source-dir extension/build/firefox-mv3-prod \
            --artifacts-dir firefox-signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          SIGNED_XPI="$(find firefox-signed -maxdepth 1 -name '*.xpi' -print -quit)"
          if [[ -z "$SIGNED_XPI" ]]; then
            echo "Mozilla signing completed without producing an XPI" >&2
            exit 1
          fi
          FIREFOX_XPI="rvault-extension-firefox-${VERSION}.xpi"
          mv "$SIGNED_XPI" "$FIREFOX_XPI"
          echo "FIREFOX_XPI=${FIREFOX_XPI}" >> "$GITHUB_ENV"
      - name: Wait for cargo-dist release
        shell: bash
        run: |
          for _ in {1..90}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for GitHub Release $GITHUB_REF_NAME" >&2
          exit 1
      - name: Upload browser extensions
        run: gh release upload "$GITHUB_REF_NAME" "$CHROMIUM_ZIP" "$FIREFOX_XPI" --clobber
