name: Extension Release
permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  upload-extension:
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Build Helium extension
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Package Helium extension
        shell: bash
        run: |
          VERSION="$(bun -e "const pkg = await import('./extension/package.json'); console.log(pkg.default.version)")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "extension/package.json version $VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          ZIP_NAME="rvault-extension-${VERSION}.zip"
          (cd extension/build/chrome-mv3-prod && zip -r "../../../${ZIP_NAME}" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
      - name: Wait for cargo-dist release
        shell: bash
        run: |
          for _ in {1..90}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for GitHub Release $GITHUB_REF_NAME" >&2
          exit 1
      - name: Upload extension ZIP
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP_NAME" --clobber
